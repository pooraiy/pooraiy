<svg width="900" height="30" viewBox="0 0 900 30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pk { animation: travel 3.2s linear infinite; }
    @keyframes travel { 0% { transform: translateX(-80px); } 100% { transform: translateX(980px); } }
  </style>
  <line x1="0" y1="15" x2="900" y2="15" stroke="#2D0A4E" stroke-width="1.5"/>
  <line x1="0" y1="15" x2="900" y2="15" stroke="#B026FF" stroke-width="1" stroke-dasharray="6 14" opacity="0.5"/>
  <g class="pk">
    <circle cx="450" cy="15" r="4" fill="#E040FB"/>
    <circle cx="450" cy="15" r="8" fill="none" stroke="#E040FB" stroke-opacity="0.5"/>
    <circle cx="430" cy="15" r="2.5" fill="#B026FF" opacity="0.7"/>
    <circle cx="470" cy="15" r="2.5" fill="#00E5FF" opacity="0.7"/>
  </g>
</svg>
