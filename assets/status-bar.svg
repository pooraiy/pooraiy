<svg width="1100" height="86" viewBox="0 0 1100 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D0219"/>
      <stop offset="50%" stop-color="#150425"/>
      <stop offset="100%" stop-color="#0D0219"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Consolas, 'Courier New', monospace; letter-spacing: 1px; }
    .dot { animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100%{opacity:.35} 50%{opacity:1} }
    .seg { animation: segIn 0.6s ease-out both; }
    .s1{animation-delay:.2s} .s2{animation-delay:.45s} .s3{animation-delay:.7s} .s4{animation-delay:.95s}
    @keyframes segIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
  </style>

  <rect x="1" y="1" width="1098" height="84" rx="10" fill="url(#barBg)" stroke="#2D0A4E" stroke-width="1.5"/>

  <!-- segment separators -->
  <line x1="300" y1="14" x2="300" y2="72" stroke="#2D0A4E" stroke-width="1"/>
  <line x1="600" y1="14" x2="600" y2="72" stroke="#2D0A4E" stroke-width="1"/>
  <line x1="850" y1="14" x2="850" y2="72" stroke="#2D0A4E" stroke-width="1"/>

  <!-- status -->
  <g class="seg s1">
    <circle class="dot" cx="38" cy="43" r="6" fill="#00E5FF"/>
    <circle cx="38" cy="43" r="10" fill="none" stroke="#00E5FF" stroke-opacity="0.3"><animate attributeName="r" values="8;14" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="58" y="36" font-size="11" fill="#8a7fa8">STATUS</text>
    <text x="58" y="56" font-size="15" fill="#00E5FF">ONLINE</text>
  </g>

  <!-- focus -->
  <g class="seg s2">
    <text x="322" y="36" font-size="11" fill="#8a7fa8">FOCUS_MODE</text>
    <text x="322" y="56" font-size="15" fill="#E040FB">BUILDING &#183; LEARNING</text>
  </g>

  <!-- uptime -->
  <g class="seg s3">
    <text x="622" y="36" font-size="11" fill="#8a7fa8">UPTIME</text>
    <text x="622" y="56" font-size="15" fill="#B026FF">99.9% &#183; ALWAYS SHIPPED</text>
  </g>

  <!-- clearance -->
  <g class="seg s4">
    <text x="872" y="36" font-size="11" fill="#8a7fa8">CLEARANCE</text>
    <text x="872" y="56" font-size="15" fill="#eae6f2">LEVEL &#8734;</text>
  </g>
</svg>
