<svg width="900" height="310" viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dialG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12042a"/><stop offset="100%" stop-color="#070310"/>
    </linearGradient>
    <filter id="dgl"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; letter-spacing: 1px; }
    .arc1 { animation: aFill 2s cubic-bezier(.2,.8,.3,1) both; animation-delay:.4s; }
    .arc2 { animation: aFill 2s cubic-bezier(.2,.8,.3,1) both; animation-delay:.7s; }
    .arc3 { animation: aFill 2s cubic-bezier(.2,.8,.3,1) both; animation-delay:1s; }
    @keyframes aFill { from { stroke-dasharray: 0 503; } }
    .pct1{animation:pin .01s 2.35s both} .pct2{animation:pin .01s 2.65s both} .pct3{animation:pin .01s 2.95s both}
    @keyframes pin { from{opacity:0} to{opacity:1} }
    .needle { transform-origin: center bottom; transform-box: fill-box; animation: nWob 5s ease-in-out infinite; }
    @keyframes nWob { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  </style>

  <rect x="1" y="1" width="898" height="308" rx="14" fill="url(#dialG)" stroke="#2D0A4E" stroke-width="1.5"/>
  <text x="450" y="38" font-size="15" fill="#E040FB" text-anchor="middle" letter-spacing="4">// SYSTEM_GAUGES :: analog_cluster //</text>
  <line x1="40" y1="52" x2="860" y2="52" stroke="#2D0A4E"/>

  <!-- GAUGE 1 : COMMIT VELOCITY 87% -->
  <g>
    <circle cx="170" cy="165" r="80" fill="#0D0219" stroke="#2D0A4E" stroke-width="2"/>
    <!-- ticks -->
    <g stroke="#2D0A4E" stroke-width="2">
      <line x1="170" y1="72" x2="170" y2="84"/><line x1="170" y1="258" x2="170" y2="246"/>
      <line x1="77" y1="165" x2="89" y2="165"/><line x1="263" y1="165" x2="251" y2="165"/>
      <line x1="104" y1="99" x2="112" y2="107"/><line x1="236" y1="231" x2="228" y2="223"/>
      <line x1="236" y1="99" x2="228" y2="107"/><line x1="104" y1="231" x2="112" y2="223"/>
    </g>
    <circle cx="170" cy="165" r="80" fill="none" stroke="#150425" stroke-width="10"/>
    <circle cx="170" cy="165" r="80" fill="none" stroke="#B026FF" stroke-width="10" stroke-linecap="round"
            class="arc1" filter="url(#dgl)" stroke-dasharray="437 503" transform="rotate(-90 170 165)"/>
    <text class="needle" x="170" y="235" font-size="42" text-anchor="middle" fill="#eae6f2">&#9650;</text>
    <text class="pct1" x="170" y="172" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">87%</text>
    <text x="170" y="196" font-size="11" fill="#8a7fa8" text-anchor="middle">COMMIT_VELOCITY</text>
  </g>

  <!-- GAUGE 2 : FOCUS LEVEL 94% -->
  <g>
    <circle cx="450" cy="165" r="80" fill="#0D0219" stroke="#2D0A4E" stroke-width="2"/>
    <g stroke="#2D0A4E" stroke-width="2">
      <line x1="450" y1="72" x2="450" y2="84"/><line x1="450" y1="258" x2="450" y2="246"/>
      <line x1="357" y1="165" x2="369" y2="165"/><line x1="543" y1="165" x2="531" y2="165"/>
      <line x1="384" y1="99" x2="392" y2="107"/><line x1="516" y1="231" x2="508" y2="223"/>
      <line x1="516" y1="99" x2="508" y2="107"/><line x1="384" y1="231" x2="392" y2="223"/>
    </g>
    <circle cx="450" cy="165" r="80" fill="none" stroke="#150425" stroke-width="10"/>
    <circle cx="450" cy="165" r="80" fill="none" stroke="#00E5FF" stroke-width="10" stroke-linecap="round"
            class="arc2" filter="url(#dgl)" stroke-dasharray="472 503" transform="rotate(-90 450 165)"/>
    <text class="needle" x="450" y="235" font-size="42" text-anchor="middle" fill="#eae6f2">&#9650;</text>
    <text class="pct2" x="450" y="172" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">94%</text>
    <text x="450" y="196" font-size="11" fill="#8a7fa8" text-anchor="middle">FOCUS_LEVEL</text>
  </g>

  <!-- GAUGE 3 : CREATIVE ENERGY 91% -->
  <g>
    <circle cx="730" cy="165" r="80" fill="#0D0219" stroke="#2D0A4E" stroke-width="2"/>
    <g stroke="#2D0A4E" stroke-width="2">
      <line x1="730" y1="72" x2="730" y2="84"/><line x1="730" y1="258" x2="730" y2="246"/>
      <line x1="637" y1="165" x2="649" y2="165"/><line x1="823" y1="165" x2="811" y2="165"/>
      <line x1="664" y1="99" x2="672" y2="107"/><line x1="796" y1="231" x2="788" y2="223"/>
      <line x1="796" y1="99" x2="788" y2="107"/><line x1="664" y1="231" x2="672" y2="223"/>
    </g>
    <circle cx="730" cy="165" r="80" fill="none" stroke="#150425" stroke-width="10"/>
    <circle cx="730" cy="165" r="80" fill="none" stroke="#E040FB" stroke-width="10" stroke-linecap="round"
            class="arc3" filter="url(#dgl)" stroke-dasharray="457 503" transform="rotate(-90 730 165)"/>
    <text class="needle" x="730" y="235" font-size="42" text-anchor="middle" fill="#eae6f2">&#9650;</text>
    <text class="pct3" x="730" y="172" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">91%</text>
    <text x="730" y="196" font-size="11" fill="#8a7fa8" text-anchor="middle">CREATIVE_ENERGY</text>
  </g>

  <g font-size="11" fill="#8a7fa8">
    <text x="34" y="292">CALIBRATION: CONTINUOUS</text>
    <text x="866" y="292" text-anchor="end">DRIFT: NONE DETECTED</text>
  </g>
</svg>
