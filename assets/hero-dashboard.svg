        <animate attributeName="y" values="322;348;314;338;322" dur="1.18s" begin=".35s" repeatCount="indefinite"/></rect>
      <rect x="1278" y="338" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="32;46;24;40;32" dur="1.22s" begin=".25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="338;324;346;330;338" dur="1.22s" begin=".25s" repeatCount="indefinite"/></rect>
      <rect x="1296" y="314" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="56;36;60;28;56" dur="1.06s" begin=".45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="314;334;310;342;314" dur="1.06s" begin=".45s" repeatCount="indefinite"/></rect>
      <rect x="1314" y="330" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="40;50;22;42;40" dur="1.32s" begin=".12s" repeatCount="indefinite"/>
        <animate attributeName="y" values="330;320;348;328;330" dur="1.32s" begin=".12s" repeatCount="indefinite"/></rect>
      <rect x="1332" y="318" width="10" fill="url(#eqG)">
