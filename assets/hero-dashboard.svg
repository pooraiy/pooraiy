      <line class="edge e2"  x1="110" y1="320" x2="190" y2="260"/>
      <line class="edge e4"  x1="190" y1="170" x2="270" y2="215"/>
      <line class="edge e3"  x1="190" y1="260" x2="270" y2="215"/>
      <line class="edge"     x1="190" y1="260" x2="270" y2="310"/>
      <line class="edge e4"  x1="270" y1="215" x2="350" y2="260"/>
      <line class="edge e2"  x1="270" y1="310" x2="350" y2="260"/>
    </g>
    <!-- firing pulses along edges -->
    <circle r="3" fill="#00E5FF"><animateMotion path="M110,200 L190,170 L270,215 L350,260" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#E040FB"><animateMotion path="M110,320 L190,260 L270,310" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="2.5" fill="#ffffff"><animateMotion path="M110,260 L190,170 L270,215" dur="3s" begin=".5s" repeatCount="indefinite"/></circle>
    <!-- node dots -->
    <g fill="#B026FF">
      <circle cx="110" cy="200" r="4"/><circle cx="110" cy="260" r="4"/><circle cx="110" cy="320" r="4"/>
      <circle cx="350" cy="260" r="5" fill="#E040FB"/>
    </g>
    <g fill="#00E5FF">
      <circle cx="190" cy="170" r="4.5"/><circle cx="190" cy="260" r="4.5"/><circle cx="270" cy="215" r="4.5"/><circle cx="270" cy="310" r="4.5"/>
    </g>
    <text x="66" y="392" font-size="12" fill="#8a7fa8">SYNAPSES FIRING &#183; 128 TFLOPS</text>
  </g>

