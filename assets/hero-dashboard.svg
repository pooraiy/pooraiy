        <animate attributeName="y" values="320;338;316;346;320" dur="1.09s" begin=".38s" repeatCount="indefinite"/></rect>
      <rect x="1386" y="334" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="36;48;26;42;36" dur="1.21s" begin=".18s" repeatCount="indefinite"/>
        <animate attributeName="y" values="334;322;344;328;334" dur="1.21s" begin=".18s" repeatCount="indefinite"/></rect>
      <rect x="1404" y="312" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="58;38;62;30;58" dur="1.04s" begin=".48s" repeatCount="indefinite"/>
        <animate attributeName="y" values="312;332;308;340;312" dur="1.04s" begin=".48s" repeatCount="indefinite"/></rect>
