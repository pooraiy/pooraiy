    <circle cx="560" cy="720" r="1.5"><animate attributeName="cy" values="720;470" dur="8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="710" r="2.5"><animate attributeName="cy" values="710;475" dur="7s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7s" begin="2.6s" repeatCount="indefinite"/></circle>
