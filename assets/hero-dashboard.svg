        <animate attributeName="y" values="328;346;320;336;328" dur="1.24s" begin=".29s" repeatCount="indefinite"/></rect>
    </g>
    <text x="1110" y="392" font-size="12" fill="#8a7fa8">OUTPUT STREAM &#183; STABLE &#183; ENCRYPTED</text>
