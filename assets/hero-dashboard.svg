        <animate attributeName="y" values="318;342;312;336;318" dur="1.12s" begin=".55s" repeatCount="indefinite"/></rect>
      <rect x="1350" y="342" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="28;44;20;38;28" dur="1.26s" begin=".07s" repeatCount="indefinite"/>
        <animate attributeName="y" values="342;326;350;332;342" dur="1.26s" begin=".07s" repeatCount="indefinite"/></rect>
      <rect x="1368" y="320" width="10" fill="url(#eqG)">
