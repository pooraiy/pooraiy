  <!-- ═══ CENTER :: ORBITAL CORE + TITLE ═══ -->
  <!-- rotating dashed rings -->
  <circle class="ring" cx="750" cy="330" r="205" fill="none" stroke="#B026FF" stroke-width="1.5" stroke-dasharray="40 220" opacity=".7"/>
  <circle class="ring" cx="750" cy="330" r="205" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="14 500" opacity=".8"/>
  <circle class="ring2" cx="750" cy="330" r="245" fill="none" stroke="#E040FB" stroke-width="1" stroke-dasharray="70 420" opacity=".5"/>
  <circle cx="750" cy="330" r="168" fill="none" stroke="#2D0A4E" stroke-width="1"/>
  <circle cx="750" cy="330" r="130" fill="none" stroke="#2D0A4E" stroke-width="1" stroke-dasharray="4 8"/>
  <!-- core breathing glow -->
  <circle cx="750" cy="330" r="86" fill="#B026FF" opacity=".08">
    <animate attributeName="r" values="82;96;82" dur="3.2s" repeatCount="indefinite"/>
  </circle>

