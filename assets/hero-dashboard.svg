  <text x="750" y="424" font-size="13" fill="#8a7fa8" text-anchor="middle" letter-spacing="3">OPERATOR_ID: PX-143358601 &#183; github.com/pooraiy<tspan fill="#00E5FF">&#9646;</tspan><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></text>

  <!-- status chips under title -->
  <g font-size="13" letter-spacing="1" text-anchor="middle">
