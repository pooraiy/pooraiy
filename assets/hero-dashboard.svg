        <animate attributeName="y" values="336;318;342;324;336" dur="1.15s" begin=".2s" repeatCount="indefinite"/></rect>
      <rect x="1224" y="312" width="10" fill="url(#eqG)">
        <animate attributeName="height" values="58;30;62;40;58" dur="1.08s" begin=".5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="312;340;308;330;312" dur="1.08s" begin=".5s" repeatCount="indefinite"/></rect>
