<svg width="900" height="310" viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A0533"/>
      <stop offset="100%" stop-color="#0D0219"/>
    </linearGradient>
    <filter id="tGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .l1 { animation: reveal 0.1s 0.4s both; }
    .l2 { animation: reveal 0.1s 1.1s both; }
    .l3 { animation: reveal 0.1s 1.8s both; }
    .l4 { animation: reveal 0.1s 2.5s both; }
    .l5 { animation: reveal 0.1s 3.4s both; }
    .l6 { animation: reveal 0.1s 4.3s both; }
    .l7 { animation: reveal 0.1s 5.2s both; }
    @keyframes reveal { from { opacity: 0 } to { opacity: 1 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    text { font-family: Consolas, 'Courier New', monospace; }
  </style>

  <!-- window frame -->
  <rect x="1" y="1" width="898" height="308" rx="12" fill="#08030f" stroke="#2D0A4E" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="42" rx="12" fill="url(#termBar)"/>
  <rect x="1" y="32" width="898" height="11" fill="#0D0219"/>

  <!-- traffic dots -->
  <circle cx="28" cy="22" r="6" fill="#E040FB"/>
  <circle cx="52" cy="22" r="6" fill="#B026FF"/>
  <circle cx="76" cy="22" r="6" fill="#00E5FF"/>
  <text x="450" y="27" font-size="14" fill="#8a7fa8" text-anchor="middle">pooraiy@nexus:~ // secure_shell</text>

  <!-- boot lines -->
  <g font-size="16">
    <text class="l1" x="30" y="78" fill="#B026FF">$ whoami</text>
    <text class="l2" x="30" y="106" fill="#eae6f2">> pooraiy :: developer &#183; engineer &#183; builder of futures</text>

    <text class="l3" x="30" y="142" fill="#B026FF">$ status --now</text>
    <text class="l4" x="30" y="170" fill="#7ee7ff">> [OK] systems nominal&#160;&#160;&#160;&#160;<tspan fill="#E040FB">[SYNC] github.com/pooraiy</tspan></text>

    <text class="l5" x="30" y="206" fill="#B026FF">$ init --profile --mode=legendary</text>
    <text class="l6" x="30" y="234" fill="#8a7fa8">> loading modules... <tspan fill="#E040FB">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</tspan>&#160;100%</text>

    <text class="l7" x="30" y="270" fill="#00E5FF" filter="url(#tGlow)">> access granted &#8212; welcome to the nexus<tspan class="cur" fill="#E040FB">&#9608;</tspan></text>
  </g>

  <!-- corner accents -->
  <g stroke="#B026FF" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 20 60 L 20 52 L 30 52"/>
    <path d="M 880 290 L 880 298 L 870 298"/>
  </g>
</svg>
