<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="labG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0320"/><stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1168"/><stop offset="100%" stop-color="#2D0A4E"/>
    </linearGradient>
    <linearGradient id="cubeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160533"/><stop offset="100%" stop-color="#0E0322"/>
    </linearGradient>
    <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#200A44"/><stop offset="100%" stop-color="#140630"/>
    </linearGradient>
    <filter id="lg3"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; letter-spacing: 1px; }
    .led { animation: ledB 1.8s steps(1) infinite; }
    .l2{animation-delay:.45s}.l3{animation-delay:.9s}.l4{animation-delay:1.35s}
    @keyframes ledB { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
    .holoF { animation: hf 4s ease-in-out infinite; }
    @keyframes hf { 0%,100%{opacity:.55} 50%{opacity:.95} }
    .scanUp { animation: scanY 5s linear infinite; }
    @keyframes scanY { from { transform: translateY(60px);} to { transform: translateY(-40px);} }
  </style>

  <rect x="1" y="1" width="898" height="458" rx="14" fill="url(#labG)" stroke="#2D0A4E" stroke-width="1.5"/>
  <text x="450" y="38" font-size="15" fill="#00E5FF" text-anchor="middle" letter-spacing="4">// DATA_LAB :: server_bay_07 //</text>

  <!-- floor grid (isometric) -->
  <g stroke="#1c0b38" stroke-width="1">
    <line x1="80" y1="430" x2="420" y2="270"/><line x1="180" y1="450" x2="520" y2="290"/>
    <line x1="280" y1="470" x2="620" y2="310"/><line x1="380" y1="486" x2="720" y2="330"/>
    <line x1="480" y1="500" x2="820" y2="350"/>
    <line x1="120" y1="300" x2="460" y2="470"/><line x1="240" y1="260" x2="600" y2="438"/>
    <line x1="360" y1="238" x2="740" y2="424"/><line x1="480" y1="222" x2="850" y2="392"/>
  </g>

  <!-- ═══ SERVER RACK 1 (left) ═══ -->
  <g transform="translate(190,250)">
    <!-- holo screen above -->
    <g class="holoF" opacity=".8">
      <rect x="-10" y="-150" width="150" height="90" rx="6" fill="#00E5FF" fill-opacity=".07" stroke="#00E5FF" stroke-opacity=".6"/>
      <polyline points="0,-75 25,-95 50,-85 75,-105 100,-88 125,-98" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="65" y="-136" text-anchor="middle" font-size="11" fill="#9BE8FF">THROUGHPUT</text>
    </g>
    <line x1="65" y1="-58" x2="65" y2="0" stroke="#00E5FF" stroke-opacity=".35" stroke-dasharray="3 5"/>

    <!-- stacked cubes -->
    <g transform="translate(0,0)">
      <polygon points="0,0 65,-32 130,0 65,32" fill="url(#cubeTop)" stroke="#B026FF" stroke-width="1"/>
      <polygon points="0,0 0,52 65,84 65,32" fill="url(#cubeL)"/>
      <polygon points="130,0 130,52 65,84 65,32" fill="url(#cubeR)"/>
      <circle class="led" cx="22" cy="34" r="3" fill="#00E5FF"/><circle class="led l2" cx="36" cy="41" r="3" fill="#E040FB"/>
    </g>
    <g transform="translate(0,-46)">
      <polygon points="0,0 65,-32 130,0 65,32" fill="url(#cubeTop)" stroke="#B026FF" stroke-width="1"/>
      <polygon points="0,0 0,46 65,78 65,32" fill="url(#cubeL)"/>
      <polygon points="130,0 130,46 65,78 65,32" fill="url(#cubeR)"/>
      <circle class="led l3" cx="24" cy="30" r="3" fill="#E040FB"/><circle class="led l4" cx="38" cy="37" r="3" fill="#00E5FF"/>
    </g>
    <text x="65" y="112" text-anchor="middle" font-size="12" fill="#8a7fa8">BUILD_CLUSTER</text>
  </g>

  <!-- ═══ SERVER RACK 2 (right, taller) ═══ -->
  <g transform="translate(560,220)">
    <g class="holoF" style="animation-delay:1s" opacity=".8">
      <rect x="-16" y="-176" width="170" height="96" rx="6" fill="#E040FB" fill-opacity=".06" stroke="#E040FB" stroke-opacity=".6"/>
      <text x="69" y="-156" text-anchor="middle" font-size="11" fill="#FFC7F5">UPTIME 99.99%</text>
      <circle cx="69" cy="-118" r="22" fill="none" stroke="#E040FB" stroke-width="4" stroke-dasharray="104 138" transform="rotate(-90 69 -118)"/>
      <text x="69" y="-113" text-anchor="middle" font-size="13" fill="#ffffff">75%</text>
    </g>
    <line x1="69" y1="-78" x2="69" y2="-14" stroke="#E040FB" stroke-opacity=".35" stroke-dasharray="3 5"/>

    <g transform="translate(0,0)">
      <polygon points="0,0 72,-36 144,0 72,36" fill="url(#cubeTop)" stroke="#B026FF" stroke-width="1"/>
      <polygon points="0,0 0,56 72,92 72,36" fill="url(#cubeL)"/>
      <polygon points="144,0 144,56 72,92 72,36" fill="url(#cubeR)"/>
      <circle class="led l2" cx="24" cy="36" r="3" fill="#E040FB"/><circle class="led" cx="38" cy="43" r="3" fill="#00E5FF"/>
    </g>
    <g transform="translate(0,-48)">
      <polygon points="0,0 72,-36 144,0 72,36" fill="url(#cubeTop)" stroke="#B026FF" stroke-width="1"/>
      <polygon points="0,0 0,48 72,84 72,36" fill="url(#cubeL)"/>
      <polygon points="144,0 144,48 72,84 72,36" fill="url(#cubeR)"/>
      <circle class="led l4" cx="26" cy="32" r="3" fill="#00E5FF"/><circle class="led l3" cx="40" cy="39" r="3" fill="#ffffff"/>
    </g>
    <g transform="translate(0,-96)">
      <polygon points="0,0 72,-36 144,0 72,36" fill="url(#cubeTop)" stroke="#B026FF" stroke-width="1"/>
      <polygon points="0,0 0,48 72,84 72,36" fill="url(#cubeL)"/>
      <polygon points="144,0 144,48 72,84 72,36" fill="url(#cubeR)"/>
      <circle class="led l3" cx="28" cy="30" r="3" fill="#00E5FF"/><circle class="led l2" cx="42" cy="37" r="3" fill="#E040FB"/>
    </g>
    <text x="72" y="120" text-anchor="middle" font-size="12" fill="#8a7fa8">DEPLOY_MAINFRAME</text>
  </g>

  <!-- rising data motes -->
  <g fill="#B026FF">
    <circle cx="255" cy="380" r="2"><animate attributeName="cy" values="400;230" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="632" cy="400" r="2"><animate attributeName="cy" values="420;210" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="360" r="1.5"><animate attributeName="cy" values="380;220" dur="4.5s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="4.5s" begin=".7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scanning sweep -->
  <rect class="scanUp" x="40" y="0" width="820" height="26" fill="#00E5FF" opacity=".04"/>

  <text x="450" y="446" font-size="11" fill="#8a7fa8" text-anchor="middle">COOLING: OPTIMAL &#183; POWER: RENEWABLE CURIOSITY &#183; STATUS: ALL GREEN</text>
</svg>
