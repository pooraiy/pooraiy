<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebV" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity=".18"/><stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebM" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity=".14"/><stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#B026FF"/><stop offset="100%" stop-color="#B026FF" stop-opacity="0"/></radialGradient>
    <filter id="sg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .tw2 { animation: tw2k 4s ease-in-out infinite; }
    .w2{animation-delay:1s}.w3{animation-delay:2s}.w4{animation-delay:3s}
    @keyframes tw2k { 0%,100%{opacity:.25} 50%{opacity:1} }
    .shoot { animation: none; }
  </style>

  <rect x="1" y="1" width="898" height="498" rx="14" fill="#030112" stroke="#2D0A4E" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="498" rx="14" fill="url(#nebV)"/>
  <rect x="1" y="1" width="898" height="498" rx="14" fill="url(#nebM)"/>

  <text x="450" y="40" font-size="15" fill="#C084FC" text-anchor="middle" letter-spacing="4">// OPERATOR_CONSTELLATION :: mapped_stars //</text>

  <!-- background stars -->
  <g fill="#ffffff">
    <circle class="tw2" cx="90" cy="120" r="1.3"/><circle class="tw2 w2" cx="200" cy="80" r="1"/>
    <circle class="tw2 w3" cx="330" cy="150" r="1.4"/><circle class="tw2 w4" cx="520" cy="70" r="1.1"/>
    <circle class="tw2" cx="660" cy="130" r="1.3"/><circle class="tw2 w2" cx="800" cy="90" r="1"/>
    <circle class="tw2 w3" cx="140" cy="300" r="1.2"/><circle class="tw2 w4" cx="270" cy="420" r="1.3"/>
    <circle class="tw2 w2" cx="480" cy="450" r="1"/><circle class="tw2" cx="700" cy="430" r="1.2"/>
    <circle class="tw2 w3" cx="850" cy="330" r="1.4"/><circle class="tw2 w4" cx="600" cy="250" r="1"/>
    <circle class="tw2" cx="380" cy="260" r="1.1"/><circle class="tw2 w2" cx="750" cy="220" r="1.2"/>
  </g>

  <!-- constellation links -->
  <g stroke="#B026FF" stroke-width="1" opacity=".55">
    <line x1="180" y1="360" x2="320" y2="290"/>
    <line x1="320" y1="290" x2="450" y2="340"/>
    <line x1="450" y1="340" x2="590" y2="260"/>
    <line x1="590" y1="260" x2="720" y2="310"/>
    <line x1="720" y1="310" x2="790" y2="210"/>
    <line x1="450" y1="340" x2="470" y2="430"/>
    <line x1="320" y1="290" x2="350" y2="180"/>
    <line x1="350" y1="180" x2="590" y2="260"/>
  </g>
  <g stroke="#E040FB" stroke-width=".7" stroke-dasharray="3 5" opacity=".35">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    <line x1="180" y1="360" x2="350" y2="180"/>
  </g>

  <!-- shooting star -->
  <g><circle r="2.5" fill="#ffffff"><animateMotion path="M100,60 L 500,190" dur="2.2s" begin="0s;9s" repeatCount="indefinite"/></circle></g>

  <!-- primary stars -->
  <g filter="url(#sg)">
    <circle cx="180" cy="360" r="6" fill="#B026FF"/>
    <circle cx="320" cy="290" r="7" fill="#E040FB"/>
    <circle cx="450" cy="340" r="8" fill="#ffffff"/>
    <circle cx="590" cy="260" r="7" fill="#00E5FF"/>
    <circle cx="720" cy="310" r="6" fill="#B026FF"/>
    <circle cx="790" cy="210" r="7" fill="#E040FB"/>
    <circle cx="350" cy="180" r="7" fill="#00E5FF"/>
    <circle cx="470" cy="430" r="6" fill="#ffffff"/>
  </g>
  <!-- pulsing halos -->
  <g fill="none" stroke="#B026FF">
    <circle cx="450" cy="340" r="12"><animate attributeName="r" values="10;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="260" r="11"><animate attributeName="r" values="9;18" dur="2.8s" begin=".6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0" dur="2.8s" begin=".6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- labels -->
  <g class="tw2" font-size="12" fill="#cfc4e8">
    <text x="168" y="384" text-anchor="end">CURIOUS</text>
    <text x="320" y="272" text-anchor="middle">DISCIPLINED</text>
    <text x="450" y="368" text-anchor="middle">POORAIY // PRIME</text>
    <text x="590" y="242" text-anchor="middle">BUILDER</text>
    <text x="720" y="334" text-anchor="middle">PERFECTIONIST</text>
    <text x="792" y="192" text-anchor="middle">VISIONARY</text>
    <text x="350" y="162" text-anchor="middle">EXPLORER</text>
    <text x="470" y="454" text-anchor="middle">SHIPPER</text>
  </g>

  <text x="450" y="484" font-size="11" fill="#8a7fa8" text-anchor="middle">COORDINATES: RA 07h 31m &#183; DEC +07&#176; &#183; SECTOR: OPEN_SOURCE</text>
</svg>
