<svg width="1000" height="26" viewBox="0 0 1000 26" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00D9FF" stop-opacity=".55"/>
      <stop offset="65%" stop-color="#A855F7" stop-opacity=".55"/>
