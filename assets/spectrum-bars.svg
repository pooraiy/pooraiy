<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2D0A4E"/><stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="spM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A0A55"/><stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>
    <linearGradient id="spC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06333a"/><stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .bar { transform-origin: center bottom; transform-box: fill-box; animation: eq 1.4s ease-in-out infinite alternate; }
    @keyframes eq { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
  </style>

  <rect x="1" y="1" width="998" height="238" rx="14" fill="#070310" stroke="#2D0A4E" stroke-width="1.5"/>
  <text x="500" y="38" font-size="15" fill="#E040FB" text-anchor="middle" letter-spacing="4">// LANGUAGE_SPECTRUM :: live_analyzer //</text>
  <line x1="40" y1="52" x2="960" y2="52" stroke="#2D0A4E"/>

  <!-- baseline -->
  <rect x="40" y="196" width="920" height="2" fill="#2D0A4E"/>

  <!-- bars: heights proportional, alternating gradients, staggered pulse -->
  <g>
    <rect class="bar" x="56"  y="76"  width="22" height="120" rx="4" fill="url(#spM)" style="animation-duration:1.2s"/>
    <rect class="bar" x="92"  y="96"  width="22" height="100" rx="4" fill="url(#spV)" style="animation-duration:1.6s"/>
    <rect class="bar" x="128" y="116" width="22" height="80"  rx="4" fill="url(#spC)" style="animation-duration:1.1s"/>
    <rect class="bar" x="164" y="136" width="22" height="60"  rx="4" fill="url(#spM)" style="animation-duration:1.8s"/>
    <rect class="bar" x="200" y="146" width="22" height="50"  rx="4" fill="url(#spV)" style="animation-duration:1.3s"/>
    <rect class="bar" x="236" y="156" width="22" height="40"  rx="4" fill="url(#spC)" style="animation-duration:1.5s"/>
    <rect class="bar" x="272" y="161" width="22" height="35"  rx="4" fill="url(#spM)" style="animation-duration:1.05s"/>
    <rect class="bar" x="308" y="166" width="22" height="30"  rx="4" fill="url(#spV)" style="animation-duration:1.7s"/>
    <rect class="bar" x="344" y="171" width="22" height="25"  rx="4" fill="url(#spC)" style="animation-duration:1.25s"/>
    <rect class="bar" x="380" y="176" width="22" height="20"  rx="4" fill="url(#spM)" style="animation-duration:1.45s"/>
    <rect class="bar" x="416" y="181" width="22" height="15"  rx="4" fill="url(#spV)" style="animation-duration:1.15s"/>
    <rect class="bar" x="452" y="184" width="22" height="12"  rx="4" fill="url(#spC)" style="animation-duration:1.55s"/>
    <rect class="bar" x="488" y="186" width="22" height="10"  rx="4" fill="url(#spM)" style="animation-duration:1.35s"/>
    <rect class="bar" x="524" y="188" width="22" height="8"   rx="4" fill="url(#spV)" style="animation-duration:1.08s"/>
    <rect class="bar" x="560" y="189" width="22" height="7"   rx="4" fill="url(#spC)" style="animation-duration:1.65s"/>
    <rect class="bar" x="596" y="190" width="22" height="6"   rx="4" fill="url(#spM)" style="animation-duration:1.22s"/>
    <rect class="bar" x="632" y="190" width="22" height="6"   rx="4" fill="url(#spV)" style="animation-duration:1.48s"/>
    <rect class="bar" x="668" y="191" width="22" height="5"   rx="4" fill="url(#spC)" style="animation-duration:1.14s"/>
    <rect class="bar" x="704" y="191" width="22" height="5"   rx="4" fill="url(#spM)" style="animation-duration:1.58s"/>
    <rect class="bar" x="740" y="192" width="22" height="4"   rx="4" fill="url(#spV)" style="animation-duration:1.02s"/>
  </g>

  <!-- labels for dominant languages -->
  <g font-size="11" fill="#eae6f2" text-anchor="middle">
    <text x="67"  y="220">PY</text><text x="103" y="220">TS</text><text x="139" y="220">JS</text>
    <text x="175" y="220">RE</text><text x="211" y="220">NX</text><text x="247" y="220">ND</text>
  </g>
  <g font-size="10" fill="#8a7fa8" text-anchor="middle">
    <text x="283" y="220">SQL</text><text x="319" y="220">DW</text><text x="355" y="220">HT</text>
    <text x="391" y="220">CS</text><text x="500" y="222">&#183;&#183;&#183;</text>
  </g>

  <text x="960" y="64" font-size="11" fill="#8a7fa8" text-anchor="end">FREQ &#183; COMMIT-WEIGHTED</text>
</svg>
