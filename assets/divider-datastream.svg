<svg width="900" height="30" viewBox="0 0 900 30" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Consolas, monospace; font-size: 12px; letter-spacing: 4px; fill: #8a7fa8; }
    .d1 { animation: fadeSeq 2.4s infinite; }
    .d2 { animation: fadeSeq 2.4s .4s infinite; }
    .d3 { animation: fadeSeq 2.4s .8s infinite; }
    @keyframes fadeSeq { 0%,100%{opacity:.25} 50%{opacity:1} }
  </style>
  <text class="d1" x="60" y="20">01&#9656;</text>
  <line x1="150" y1="15" x2="750" y2="15" stroke="#B026FF" stroke-width="1" stroke-dasharray="10 6" opacity=".55">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text class="d2" x="770" y="20">&#9656;10</text>
  <text class="d3" x="380" y="20" fill="#E040FB">// DATA STREAM //</text>
</svg>
