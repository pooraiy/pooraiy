<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160533"/><stop offset="45%" stop-color="#0B0220"/><stop offset="100%" stop-color="#1A0533"/>
    </linearGradient>
    <linearGradient id="holoShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#E040FB" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="holoGlow" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect x="70" y="55" width="760" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .shine { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0%{transform:translateX(-500px)} 55%,100%{transform:translateX(850px)} }
    .cardFloat { animation: cf 6s ease-in-out infinite; }
    @keyframes cf { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .holoText { animation: holoShift 5s ease-in-out infinite; }
    @keyframes holoShift { 0%,100%{fill:#00E5FF} 50%{fill:#E040FB} }
  </style>

  <!-- ambient glow behind card -->
  <ellipse cx="450" cy="230" rx="380" ry="180" fill="#B026FF" opacity=".07">
    <animate attributeName="opacity" values=".05;.11;.05" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g class="cardFloat">
    <g transform="rotate(-3 450 215)">
      <!-- card body -->
      <rect x="66" y="51" width="768" height="328" rx="20" fill="#000000" opacity=".55"/>
      <rect x="70" y="55" width="760" height="320" rx="18" fill="url(#cardG)" stroke="#B026FF" stroke-width="2"/>
      <rect x="70" y="55" width="760" height="320" rx="18" fill="url(#holoGlow)"/>

      <!-- header strip -->
      <rect x="70" y="55" width="760" height="52" rx="18" fill="#12042A"/>
      <rect x="70" y="95" width="760" height="12" fill="#12042A"/>
      <text x="94" y="88" font-size="17" fill="#E9D5FF" letter-spacing="4">OPERATOR_IDENTIFICATION</text>
      <circle class="holoText" cx="806" cy="81" r="7"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>

      <!-- hex avatar zone -->
      <g transform="translate(150,205)">
        <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#0D0219" stroke="#B026FF" stroke-width="2"/>
        <polygon points="0,-40 34,-20 34,20 0,40 -34,20 -34,-20" fill="none" stroke="#E040FB" stroke-opacity=".5" stroke-dasharray="5 5">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
        </polygon>
        <text y="14" font-size="44" font-weight="bold" fill="#E9D5FF" text-anchor="middle">P</text>
        <text y="-72" font-size="10" fill="#8a7fa8" text-anchor="middle" letter-spacing="2">BIOMETRIC</text>
        <text y="82" font-size="10" fill="#8a7fa8" text-anchor="middle" letter-spacing="2">VERIFIED &#10003;</text>
      </g>

      <!-- fields -->
      <g font-size="15" fill="#eae6f2">
        <text x="260" y="140" font-size="11" fill="#8a7fa8" letter-spacing="2">ALIAS</text>
        <text x="260" y="162" fill="#B026FF" font-weight="bold">POORAIY</text>
        <text x="520" y="140" font-size="11" fill="#8a7fa8" letter-spacing="2">CLASS</text>
        <text x="520" y="162">BUILDER // ARCHITECT</text>

        <text x="260" y="200" font-size="11" fill="#8a7fa8" letter-spacing="2">OPERATIVE_SINCE</text>
        <text x="260" y="222">EST. 2023 &#183; ACTIVE</text>
        <text x="520" y="200" font-size="11" fill="#8a7fa8" letter-spacing="2">CLEARANCE</text>
        <text x="520" y="222" fill="#00E5FF">&#8734; UNRESTRICTED</text>

        <text x="260" y="260" font-size="11" fill="#8a7fa8" letter-spacing="2">SPECIALIZATION</text>
        <text x="260" y="282">WEB &#183; CLOUD &#183; AI SYSTEMS</text>
        <text x="520" y="260" font-size="11" fill="#8a7fa8" letter-spacing="2">STATUS</text>
        <text x="520" y="282" fill="#E040FB">&#9679; MISSION READY</text>
      </g>

      <!-- barcode -->
      <g transform="translate(260,306)" fill="#eae6f2" opacity=".85">
        <rect width="4" height="42"/><rect x="8" width="2" height="42"/><rect x="14" width="6" height="42"/>
        <rect x="24" width="2" height="42"/><rect x="30" width="8" height="42"/><rect x="42" width="3" height="42"/>
        <rect x="49" width="2" height="42"/><rect x="55" width="6" height="42"/><rect x="65" width="2" height="42"/>
        <rect x="71" width="9" height="42"/><rect x="84" width="3" height="42"/><rect x="91" width="2" height="42"/>
        <rect x="97" width="5" height="42"/><rect x="106" width="2" height="42"/><rect x="112" width="7" height="42"/>
        <rect x="123" width="3" height="42"/><rect x="130" width="2" height="42"/><rect x="136" width="8" height="42"/>
        <rect x="148" width="4" height="42"/><rect x="156" width="2" height="42"/><rect x="162" width="6" height="42"/>
      </g>
      <text x="260" y="364" font-size="11" fill="#8a7fa8" letter-spacing="6">PX&#183;143358601&#183;NEXUS&#183;AUTH</text>

      <!-- holographic shine sweep -->
      <rect class="shine" x="-300" y="55" width="240" height="320" fill="url(#holoShine)" clip-path="url(#cardClip)"/>

      <!-- chip icon -->
      <g transform="translate(700,330)" stroke="#00E5FF" stroke-width="1.5" fill="none" opacity=".8">
        <rect x="-14" y="-14" width="28" height="28" rx="4"/>
        <rect x="-6" y="-6" width="12" height="12" fill="#00E5FF" fill-opacity=".25"/>
        <line x1="-14" y1="-6" x2="-22" y2="-6"/><line x1="-14" y1="6" x2="-22" y2="6"/>
        <line x1="14" y1="-6" x2="22" y2="-6"/><line x1="14" y1="6" x2="22" y2="6"/>
        <line x1="-6" y1="-14" x2="-6" y2="-22"/><line x1="6" y1="-14" x2="6" y2="-22"/>
        <line x1="-6" y1="14" x2="-6" y2="22"/><line x1="6" y1="14" x2="6" y2="22"/>
      </g>
    </g>
  </g>
</svg>
