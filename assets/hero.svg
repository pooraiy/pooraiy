<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06060C"/><stop offset="100%" stop-color="#0B0716"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="18%" cy="12%" r="45%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity=".10"/><stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".12"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B7CF6" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .title { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; }
    .pulse { transform-origin: 600px 190px; animation: pring 5s ease-out infinite; }
    @keyframes pring { 0%{transform:scale(.6);opacity:.35} 80%{transform:scale(1.25);opacity:0} 100%{opacity:0} }
    .dotRun { animation: run 6s linear infinite; }
    @keyframes run { from{transform:translateX(-620px)} to{transform:translateX(620px)} }
    .fadeUp { animation: fu 1s ease-out both; }
    .f2 { animation-delay:.25s } .f3 { animation-delay:.5s }
    @keyframes fu { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#blueGlow)"/>
  <rect width="1200" height="400" fill="url(#purpleGlow)"/>

  <!-- corner ticks -->
  <g stroke="#3D3A55" stroke-width="1.5" opacity=".8">
    <path d="M40,36 L40,24 L54,24"/><path d="M1160,36 L1160,24 L1146,24"/>
    <path d="M40,364 L40,376 L54,376"/><path d="M1160,364 L1160,376 L1146,376"/>
  </g>

  <!-- pulse ring behind name -->
  <circle class="pulse" cx="600" cy="190" r="150" fill="none" stroke="#A855F7" stroke-width="1"/>

  <!-- eyebrow -->
  <g class="fadeUp">
    <text x="600" y="112" text-anchor="middle" font-size="14" fill="#A855F7" letter-spacing="8">DIGITAL CRAFTSMAN</text>
  </g>

  <!-- name -->
  <g class="fadeUp f2">
    <text class="title" x="600" y="205" text-anchor="middle" font-size="76" letter-spacing="22"
          fill="none" stroke="url(#nameGrad)" stroke-width="1" opacity=".35">POORAIY</text>
    <text class="title" x="600" y="203" text-anchor="middle" font-size="76" letter-spacing="22" fill="#F4F2FF">POORAIY</text>
    <text class="title" x="600" y="203" text-anchor="middle" font-size="76" letter-spacing="22"
          fill="url(#nameGrad)" opacity=".28" filter="url(#glow)">POORAIY</text>
  </g>

  <!-- hairline + traveling light -->
  <line x1="300" y1="252" x2="900" y2="252" stroke="url(#hairline)" stroke-width="1.5"/>
  <g class="dotRun"><circle cx="600" cy="252" r="3" fill="#00D9FF" filter="url(#glow)"/></g>

  <!-- tagline -->
  <g class="fadeUp f3">
    <text x="600" y="296" text-anchor="middle" font-size="15" fill="#9BA0B8" letter-spacing="4">BUILDING CLEAN SYSTEMS &#183; MODERN WEB &#183; CLOUD</text>
    <text x="600" y="330" text-anchor="middle" font-size="13" fill="#5E6079" letter-spacing="2">github.com/pooraiy<tspan class="caret" fill="#00D9FF">&#9646;</tspan></text>
  </g>
</svg>
