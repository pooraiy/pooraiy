<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05050B"/><stop offset="100%" stop-color="#0D0918"/>
    </linearGradient>
    <linearGradient id="duo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="soft40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow6"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".45"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .title { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:700; }
    .tw { animation: tw 4s ease-in-out infinite; }
    .t2{animation-delay:1.2s}.t3{animation-delay:2.3s}.t4{animation-delay:3.1s}
    @keyframes tw { 0%,100%{opacity:.12} 50%{opacity:.75} }
    .dashFlow { animation: df 14s linear infinite; }
    @keyframes df { to { stroke-dashoffset:-220 } }
    .pulse { transform-origin:600px 205px; animation:pr 6s ease-out infinite; }
    @keyframes pr { 0%{transform:scale(.65);opacity:.3} 85%{transform:scale(1.22);opacity:0} 100%{opacity:0} }
    .dotRun { animation: run 7s linear infinite; }
    @keyframes run { from{transform:translateX(-620px)} to{transform:translateX(620px)} }
    .fadeUp { animation: fu 1s ease-out both; }
    .f2{animation-delay:.25s}.f3{animation-delay:.5s}
    @keyframes fu { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .caret { animation: bl 1.1s steps(1) infinite; }
    @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .satOrbit { animation: none; }
  </style>

  <!-- atmosphere -->
  <rect width="1200" height="430" fill="url(#bg)"/>
  <g filter="url(#soft40)">
    <ellipse cx="230" cy="60" rx="360" ry="150" fill="#00D9FF" opacity=".07"/>
    <ellipse cx="990" cy="330" rx="400" ry="170" fill="#A855F7" opacity=".09"/>
  </g>

  <!-- fine stars -->
  <g fill="#C9CBDF">
    <circle class="tw" cx="140" cy="70" r="1.1"/><circle class="tw t2" cx="320" cy="150" r=".9"/>
    <circle class="tw t3" cx="520" cy="55" r="1.2"/><circle class="tw" cx="820" cy="90" r=".9"/>
    <circle class="tw t4" cx="1010" cy="60" r="1.1"/><circle class="tw t2" cx="1120" cy="160" r=".9"/>
    <circle class="tw t3" cx="90" cy="260" r="1"/><circle class="tw t4" cx="1140" cy="300" r="1"/>
    <circle class="tw" cx="450" cy="380" r=".9"/><circle class="tw t2" cx="760" cy="395" r="1"/>
  </g>

  <!-- orbital arcs behind name -->
  <ellipse cx="600" cy="215" rx="345" ry="115" fill="none" stroke="url(#duo)" stroke-width="1" opacity=".22"/>
  <ellipse cx="600" cy="215" rx="262" ry="84" fill="none" stroke="#8B7CF6" stroke-width="1"
           stroke-dasharray="3 9" opacity=".28" class="dashFlow"/>
  <!-- satellite riding the outer arc -->
  <circle r="2.6" fill="#00D9FF" filter="url(#glow6)">
    <animateMotion path="M255,215 a345,115 0 1,0 690,0 a345,115 0 1,0 -690,0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#E040FB">
    <animateMotion path="M255,215 a345,115 0 1,1 690,0 a345,115 0 1,1 -690,0" dur="27s" repeatCount="indefinite"/>
  </circle>

    <!-- vignette for depth -->
    <rect width="1200" height="430" fill="url(#vignette)"/>

    <!-- pulse ring -->
    <circle class="pulse" cx="600" cy="205" r="150" fill="none" stroke="#A855F7"/>

    <!-- corner ticks -->
    <g stroke="#3A3656" stroke-width="1.5" opacity=".95">
      <path d="M42,38 L42,25 L57,25"/><path d="M1158,38 L1158,25 L1143,25"/>
      <path d="M42,392 L42,405 L57,405"/><path d="M1158,392 L1158,405 L1143,405"/>
    </g>

  <!-- eyebrow -->
  <text class="fadeUp" x="600" y="108" text-anchor="middle" font-size="13" fill="#A78BFA" letter-spacing="9">&#9670; DIGITAL CRAFTSMAN &#9670;</text>

  <!-- name -->
  <g class="fadeUp f2">
    <text class="title" x="600" y="222" text-anchor="middle" font-size="78" letter-spacing="24"
          fill="none" stroke="url(#duo)" stroke-width="1" opacity=".32">POORAIY</text>
    <text class="title" x="600" y="220" text-anchor="middle" font-size="78" letter-spacing="24" fill="#F6F4FF">POORAIY</text>
    <text class="title" x="600" y="220" text-anchor="middle" font-size="78" letter-spacing="24"
          fill="url(#duo)" opacity=".25" filter="url(#glow6)">POORAIY</text>
  </g>

  <!-- hairline + runner -->
  <line x1="310" y1="266" x2="890" y2="266" stroke="url(#duo)" stroke-width="1.3" opacity=".55"/>
  <g class="dotRun"><circle cx="600" cy="266" r="3" fill="#7DD3FC" filter="url(#glow6)"/></g>

  <!-- taglines -->
  <text class="fadeUp f3" x="600" y="308" text-anchor="middle" font-size="14" fill="#9BA0B8" letter-spacing="5">CLEAN SYSTEMS &#183; MODERN WEB &#183; CLOUD NATIVE</text>
  <text class="fadeUp f3" x="600" y="342" text-anchor="middle" font-size="12" fill="#5E6079" letter-spacing="3">github.com/pooraiy<tspan class="caret" fill="#00D9FF">&#9646;</tspan></text>
</svg>
