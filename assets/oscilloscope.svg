<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oscG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12042a"/><stop offset="100%" stop-color="#070310"/>
    </linearGradient>
    <pattern id="oscGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#1c0b38" stroke-width="1"/>
    </pattern>
    <filter id="ph"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; }
    .w1 { animation: waveShift 4s linear infinite; }
    .w2 { animation: waveShift 6.5s linear infinite reverse; }
    @keyframes waveShift { from { transform: translateX(0); } to { transform: translateX(-240px); } }
    .dotP { animation: dp 1.4s ease-in-out infinite; }
    @keyframes dp { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>

  <rect x="1" y="1" width="798" height="278" rx="14" fill="url(#oscG)" stroke="#2D0A4E" stroke-width="1.5"/>
  <text x="400" y="36" font-size="15" fill="#B026FF" text-anchor="middle" letter-spacing="4">// CREATIVITY_OSCILLOSCOPE :: dual_trace //</text>

  <!-- grid -->
  <rect x="20" y="50" width="760" height="190" fill="#050208" stroke="#2D0A4E"/>
  <rect x="20" y="50" width="760" height="190" fill="url(#oscGrid)"/>
  <line x1="20" y1="145" x2="780" y2="145" stroke="#2D0A4E" stroke-width="1.5"/>

  <!-- trace 1 (violet sine), tile width 240 -->
  <g clip-path="url(#clipO)">
    <clipPath id="clipO"><rect x="20" y="50" width="760" height="190"/></clipPath>
    <g>
      <path d="M0,145 Q 30,75 60,145 T 120,145 T 180,145 T 240,145 T 300,145 T 360,145 T 420,145 T 480,145 T 540,145 T 600,145 T 660,145 T 720,145 T 780,145 T 840,145 T 900,145 T 960,145 T 1020,145 T 1080,145"
            fill="none" stroke="#B026FF" stroke-width="2.5" filter="url(#ph)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -240 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- trace 2 (cyan, higher freq + smaller amp) -->
    <g>
      <path d="M0,145 Q 20,105 40,145 T 80,145 T 120,145 T 160,145 T 200,145 T 240,145 T 280,145 T 320,145 T 360,145 T 400,145 T 440,145 T 480,145 T 520,145 T 560,145 T 600,145 T 640,145 T 680,145 T 720,145 T 760,145 T 800,145 T 840,145 T 880,145 T 920,145 T 960,145 T 1000,145 T 1040,145 T 1080,145"
            fill="none" stroke="#00E5FF" stroke-width="1.8" opacity=".85" filter="url(#ph)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -240 0" dur="6.5s" repeatCount="indefinite"/>
    </g>
    <!-- trace 3 (magenta slow large) -->
    <g>
      <path d="M0,145 Q 60,55 120,145 T 240,145 T 360,145 T 480,145 T 600,145 T 720,145 T 840,145 T 960,145 T 1080,145"
            fill="none" stroke="#E040FB" stroke-width="1.5" opacity=".6"/>
      <animateTransform attributeName="transform" type="translate" values="-240 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- corner readouts -->
  <g font-size="11" fill="#8a7fa8">
    <text class="dotP" x="32" y="70" fill="#00E5FF">&#9679; TRACING</text>
    <text x="768" y="70" text-anchor="end">GAIN: AUTO</text>
    <text x="32" y="232">CH1: IDEAS &#183; CH2: EXECUTION &#183; CH3: OBSESSION</text>
    <text x="768" y="232" text-anchor="end">SIGNAL: PURE</text>
  </g>
</svg>
