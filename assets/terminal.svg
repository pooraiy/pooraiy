<svg width="760" height="230" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#120E22"/><stop offset="100%" stop-color="#0A0814"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; font-size:15px; }
    .l1{animation:in .06s .3s both} .l2{animation:in .06s .9s both} .l3{animation:in .06s 1.5s both}
    .l4{animation:in .06s 2.1s both} .l5{animation:in .06s 2.7s both} .l6{animation:in .06s 3.3s both}
    @keyframes in { from{opacity:0} to{opacity:1} }
    .cur { animation: b 1s steps(1) infinite; }
    @keyframes b { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <rect x="1" y="1" width="758" height="228" rx="10" fill="url(#tw)" stroke="#26223D"/>
  <rect x="1" y="1" width="758" height="36" rx="10" fill="#141024"/>
  <rect x="1" y="27" width="758" height="10" fill="#141024"/>
  <circle cx="26" cy="19" r="4.5" fill="#00D9FF" opacity=".8"/>
  <circle cx="46" cy="19" r="4.5" fill="#A855F7" opacity=".8"/>
  <text x="380" y="24" text-anchor="middle" font-size="12" fill="#5E6079">pooraiy &#8212; zsh</text>

  <text class="l1" x="28" y="66" fill="#00D9FF">$ whoami</text>
  <text class="l2" x="28" y="92" fill="#D6D4E8">pooraiy &#8212; developer crafting precise, modern software</text>

  <text class="l3" x="28" y="126" fill="#00D9FF">$ focus</text>
  <text class="l4" x="28" y="152" fill="#D6D4E8">clean architecture &#183; web platforms &#183; cloud systems</text>

  <text class="l5" x="28" y="186" fill="#00D9FF">$ motto</text>
  <text class="l6" x="28" y="212" fill="#A855F7">"simple is hard. simple is worth it."<tspan class="cur">&#9646;</tspan></text>
</svg>
