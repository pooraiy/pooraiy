<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D0A4E"/>
      <stop offset="60%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>
    <filter id="sGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Consolas, 'Courier New', monospace; letter-spacing: 1px; }
    .bar { transform-origin: left center; animation: charge 1.6s cubic-bezier(.2,.7,.3,1) both; }
    .b1{animation-delay:.2s} .b2{animation-delay:.45s} .b3{animation-delay:.7s}
    .b4{animation-delay:.95s} .b5{animation-delay:1.2s} .b6{animation-delay:1.45s}
    @keyframes charge { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .shimmer { animation: shift 2.8s linear infinite; }
    @keyframes shift { 0% { transform: translateX(-160px);} 100% { transform: translateX(780px);} }
    .pct { animation: pctIn .01s both; }
    .p1{animation-delay:1.75s} .p2{animation-delay:2s} .p3{animation-delay:2.25s}
    .p4{animation-delay:2.5s} .p5{animation-delay:2.75s} .p6{animation-delay:3s}
    @keyframes pctIn { from{opacity:0} to{opacity:1} }
  </style>

  <!-- panel -->
  <rect x="1" y="1" width="898" height="438" rx="12" fill="#070310" stroke="#2D0A4E" stroke-width="2"/>
  <text x="450" y="44" font-size="18" fill="#B026FF" text-anchor="middle" font-weight="bold">SKILL_MATRIX // core_competencies v2.0</text>
  <line x1="30" y1="62" x2="870" y2="62" stroke="#2D0A4E" stroke-width="1"/>

  <!-- rows: label / track / fill -->
  <g font-size="14" fill="#eae6f2">
    <!-- PYTHON -->
    <text x="34" y="102">PYTHON</text><text class="pct p1" x="866" y="102" fill="#00E5FF" text-anchor="end">88%</text>
    <rect x="34" y="112" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b1" x="34" y="112" width="732" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>

    <!-- TYPESCRIPT / JS -->
    <text x="34" y="158">TYPESCRIPT &#183; JAVASCRIPT</text><text class="pct p2" x="866" y="158" fill="#00E5FF" text-anchor="end">84%</text>
    <rect x="34" y="168" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b2" x="34" y="168" width="699" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>

    <!-- REACT / NEXT -->
    <text x="34" y="214">REACT &#183; NEXT.JS</text><text class="pct p3" x="866" y="214" fill="#00E5FF" text-anchor="end">85%</text>
    <rect x="34" y="224" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b3" x="34" y="224" width="707" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>

    <!-- NODE -->
    <text x="34" y="270">NODE.JS</text><text class="pct p4" x="866" y="270" fill="#00E5FF" text-anchor="end">78%</text>
    <rect x="34" y="280" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b4" x="34" y="280" width="649" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>

    <!-- CLOUD/DEVOPS -->
    <text x="34" y="326">DOCKER &#183; AWS &#183; CI/CD</text><text class="pct p5" x="866" y="326" fill="#00E5FF" text-anchor="end">74%</text>
    <rect x="34" y="336" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b5" x="34" y="336" width="616" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>

    <!-- SQL -->
    <text x="34" y="382">SQL &#183; DATABASES</text><text class="pct p6" x="866" y="382" fill="#00E5FF" text-anchor="end">76%</text>
    <rect x="34" y="392" width="832" height="10" rx="5" fill="#150425"/>
    <rect class="bar b6" x="34" y="392" width="632" height="10" rx="5" fill="url(#skillFill)" filter="url(#sGlow)"/>
  </g>

  <!-- shimmer sweep across panel -->
  <g opacity="0.35"><rect class="shimmer" x="34" y="90" width="120" height="320" fill="#B026FF" opacity="0.06"/></g>
</svg>
