<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D0A4E"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fm"><rect width="1200" height="150" fill="url(#fadeDown)"/></mask>
  </defs>
  <style>
    text { font-family: Consolas, monospace; letter-spacing: 4px; }
    .w1 { animation: drift 7s ease-in-out infinite; }
    .w2 { animation: drift 10s ease-in-out infinite reverse; }
    @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-60px)} }
  </style>

  <rect width="1200" height="150" fill="#050208"/>

  <!-- energy waves -->
  <g mask="url(#fm)">
    <path class="w1" d="M -100 90 Q 50 40 200 90 T 500 90 T 800 90 T 1100 90 T 1400 90 L 1400 150 L -100 150 Z"
          fill="url(#wave1)" opacity="0.25"/>
    <path class="w2" d="M -100 105 Q 100 65 300 105 T 700 105 T 1100 105 T 1500 105 L 1500 150 L -100 150 Z"
          fill="#B026FF" opacity="0.18"/>
    <path class="w1" d="M -100 70 Q 50 40 200 70 T 500 70 T 800 70 T 1100 70 T 1400 70"
          fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- signal decay dots -->
  <g fill="#B026FF">
    <circle cx="540" cy="30" r="3"><animate attributeName="opacity" values="1;.15;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="30" r="2.5"><animate attributeName="opacity" values=".8;.12;.8" dur="2s" begin=".25s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="2"><animate attributeName="opacity" values=".6;.1;.6" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="30" r="1.5"><animate attributeName="opacity" values=".4;.08;.4" dur="2s" begin=".75s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="30" r="1"><animate attributeName="opacity" values=".25;.05;.25" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#8a7fa8">&#9608; TRANSMISSION END &#183; SIGNAL MAINTAINED &#183; POORAIY_OUT &#9608;</text>
</svg>
