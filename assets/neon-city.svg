<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03010A"/><stop offset="55%" stop-color="#12042A"/>
      <stop offset="82%" stop-color="#2D0A4E"/><stop offset="100%" stop-color="#43105F"/>
    </linearGradient>
    <radialGradient id="portalG" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity=".95"/>
      <stop offset="35%" stop-color="#B026FF" stop-opacity=".5"/>
      <stop offset="75%" stop-color="#E040FB" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizGlow" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity=".28"/>
      <stop offset="60%" stop-color="#B026FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleCity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#F3E8FF"/><stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="winV" width="18" height="24" patternUnits="userSpaceOnUse">
      <rect width="18" height="24" fill="none"/>
      <rect x="5" y="6" width="7" height="10" fill="#B026FF" opacity=".38"/>
    </pattern>
    <pattern id="winM" width="20" height="26" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="8" height="11" fill="#E040FB" opacity=".30"/>
    </pattern>
    <pattern id="winC" width="16" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="6" height="9" fill="#00E5FF" opacity=".25"/>
    </pattern>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="ng2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="cityClip"><rect x="0" y="0" width="1500" height="620"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI','Arial Black',sans-serif; }
    .mono { font-family: Consolas,'Courier New',monospace; }
    .tw { animation: twk 3s ease-in-out infinite; }
    .t2{animation-delay:.8s}.t3{animation-delay:1.6s}.t4{animation-delay:2.2s}.t5{animation-delay:1.1s}
    @keyframes twk { 0%,100%{opacity:.15} 50%{opacity:.9} }
    .ga2 { animation: glA 4.2s infinite steps(1); }
    .gb2 { animation: glB 3.6s infinite steps(1); }
    @keyframes glA { 0%,90%{transform:translate(0,0);opacity:0} 91%{transform:translate(-6px,3px);opacity:.85} 93%{transform:translate(5px,-2px);opacity:.65} 95%{transform:translate(0,0);opacity:0} }
    @keyframes glB { 0%,86%{transform:translate(0,0);opacity:0} 87%{transform:translate(6px,-3px);opacity:.75} 89%{transform:translate(-5px,2px);opacity:.55} 91%{transform:translate(0,0);opacity:0} }
    .beamL { transform-origin: 240px 330px; animation: beamSwing 11s ease-in-out infinite; }
    .beamR { transform-origin: 1290px 300px; animation: beamSwing 13s ease-in-out infinite reverse; }
    @keyframes beamSwing { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(18deg)} }
    .flick { animation: flicker 7s infinite steps(1); }
    .f2{animation-duration:9s} .f3{animation-duration:5.5s}
    @keyframes flicker { 0%,73%,77%,100%{opacity:.85} 74%,76%{opacity:.15} }
    .neonHum { animation: hum 2.8s ease-in-out infinite; }
    @keyframes hum { 0%,100%{opacity:.85} 50%{opacity:1} }
    .ringRot { transform-origin: 1150px 185px; animation: rr 30s linear infinite; }
    @keyframes rr { to { transform: rotate(360deg); } }
    .reflP { animation: rp 4s ease-in-out infinite; }
    @keyframes rp { 0%,100%{opacity:.35} 50%{opacity:.6} }
  </style>

  <g clip-path="url(#cityClip)">
    <!-- ═══ SKY ═══ -->
    <rect width="1500" height="620" fill="url(#skyG)"/>
    <ellipse cx="750" cy="600" rx="1100" ry="260" fill="url(#horizGlow)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="tw" cx="80" cy="70" r="1.6"/><circle class="tw t2" cx="220" cy="130" r="1.2"/>
      <circle class="tw t3" cx="420" cy="60" r="1.5"/><circle class="tw t4" cx="640" cy="100" r="1.1"/>
      <circle class="tw t5" cx="900" cy="55" r="1.4"/><circle class="tw t2" cx="1010" cy="140" r="1.2"/>
      <circle class="tw" cx="1330" cy="70" r="1.5"/><circle class="tw t3" cx="1440" cy="150" r="1.2"/>
      <circle class="tw t4" cx="550" cy="170" r="1"/><circle class="tw t5" cx="1230" cy="60" r="1.3"/>
      <circle class="tw t2" cx="160" cy="210" r="1"/><circle class="tw t3" cx="760" cy="180" r="1.1"/>
    </g>

    <!-- portal planet -->
    <circle cx="1150" cy="185" r="105" fill="url(#portalG)"/>
    <circle cx="1150" cy="185" r="104" fill="#0D0320" opacity=".25"/>
    <circle cx="1150" cy="185" r="104" fill="none" stroke="#E040FB" stroke-width="1.5" opacity=".7" filter="url(#ng2)"/>
    <g class="ringRot">
      <ellipse cx="1150" cy="185" rx="165" ry="42" fill="none" stroke="#B026FF" stroke-width="1" stroke-dasharray="30 22" opacity=".6"/>
      <ellipse cx="1150" cy="185" rx="200" ry="52" fill="none" stroke="#00E5FF" stroke-width=".8" stroke-dasharray="4 14" opacity=".45"/>
    </g>

    <!-- flying vehicles -->
    <g>
      <line x1="-90" y1="0" x2="-30" y2="0" stroke="#00E5FF" stroke-width="2" opacity=".7">
        <animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/></line>
      <circle r="3.5" fill="#E9F6FF"><animateMotion path="M-60,120 L1560,96" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#FFD9FB"><animateMotion path="M1560,165 L-60,150" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle r="2.5" fill="#D9FBFF"><animateMotion path="M-60,205 L1560,215" dur="15s" begin="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- searchlight beams -->
    <polygon class="beamL" points="240,330 180,-40 320,-40" fill="#B026FF" opacity=".07"/>
    <polygon class="beamR" points="1290,300 1220,-40 1380,-40" fill="#00E5FF" opacity=".06"/>

    <!-- ═══ BACK SKYLINE ═══ -->
    <g fill="#170733">
      <rect x="0" y="400" width="90" height="220"/><rect x="110" y="370" width="70" height="250"/>
      <rect x="330" y="410" width="100" height="210"/><rect x="460" y="380" width="60" height="240"/>
      <rect x="700" y="395" width="90" height="225"/><rect x="860" y="365" width="70" height="255"/>
      <rect x="1060" y="400" width="110" height="220"/><rect x="1420" y="380" width="80" height="240"/>
      <polygon points="145,370 145,340 150,340 150,370"/>
      <polygon points="890,365 890,330 895,330 895,365"/>
    </g>
    <!-- antenna beacons -->
    <circle cx="147" cy="336" r="2.5" fill="#E040FB"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="892" cy="326" r="2.5" fill="#00E5FF"><animate attributeName="opacity" values="1;.1;1" dur="2.8s" repeatCount="indefinite"/></circle>

    <!-- ═══ MID SKYLINE ═══ -->
    <g>
      <rect x="60" y="300" width="110" height="320" fill="#1E0940"/>
      <rect x="60" y="300" width="110" height="320" fill="url(#winV)"/>
      <rect x="200" y="340" width="90" height="280" fill="#190836"/>
      <rect x="200" y="340" width="90" height="280" fill="url(#winC)"/>
      <rect x="320" y="270" width="130" height="350" fill="#200A44"/>
      <rect x="320" y="270" width="130" height="350" fill="url(#winM)"/>
      <rect x="480" y="320" width="100" height="300" fill="#1B0939"/>
      <rect x="480" y="320" width="100" height="300" fill="url(#winV)"/>
      <rect x="900" y="310" width="120" height="310" fill="#200A44"/>
      <rect x="900" y="310" width="120" height="310" fill="url(#winM)"/>
      <rect x="1050" y="350" width="90" height="270" fill="#190836"/>
      <rect x="1050" y="350" width="90" height="270" fill="url(#winC)"/>
      <rect x="1170" y="290" width="125" height="330" fill="#1E0940"/>
      <rect x="1170" y="290" width="125" height="330" fill="url(#winV)"/>
      <rect x="1330" y="335" width="100" height="285" fill="#1B0939"/>
      <rect x="1330" y="335" width="100" height="285" fill="url(#winM)"/>
    </g>

    <!-- flickering windows -->
    <g fill="#E9F6FF">
      <rect class="flick" x="341" y="292" width="8" height="11"/>
      <rect class="flick f2" x="941" y="332" width="8" height="11" fill="#00E5FF"/>
      <rect class="flick f3" x="1191" y="312" width="8" height="11" fill="#E040FB"/>
    </g>

    <!-- neon signs on mid towers -->
    <g filter="url(#ng2)">
      <rect x="332" y="430" width="106" height="30" rx="4" fill="none" stroke="#00E5FF" stroke-width="2" class="neonHum"/>
      <text class="mono neonHum" x="385" y="451" text-anchor="middle" font-size="17" fill="#9BE8FF" letter-spacing="2">OPEN 24/7</text>
    </g>
    <g class="mono neonHum" filter="url(#ng2)" font-size="19" fill="#FF9DF3" text-anchor="middle">
      <text x="960" y="500">N</text><text x="960" y="524">E</text><text x="960" y="548">X</text><text x="960" y="572">U</text><text x="960" y="596">S</text>
      <animate attributeName="opacity" values="1;.55;1" dur="3.4s" repeatCount="indefinite"/>
    </g>

    <!-- ═══ FRONT SKYLINE ═══ -->
    <g fill="#0C031E">
      <rect x="-20" y="440" width="180" height="180"/>
      <rect x="250" y="470" width="150" height="150"/>
      <rect x="560" y="450" width="130" height="170"/>
      <rect x="720" y="480" width="170" height="140"/>
      <rect x="1240" y="455" width="160" height="165"/>
      <rect x="1430" y="430" width="90" height="190"/>
    </g>
    <!-- front tower edge lights -->
    <g stroke="#E040FB" stroke-width="2" opacity=".8">
      <line x1="250" y1="470" x2="250" y2="620"><animate attributeName="opacity" values=".8;.3;.8" dur="3s" repeatCount="indefinite"/></line>
      <line x1="720" y1="480" x2="720" y2="620"><animate attributeName="opacity" values=".3;.8;.3" dur="3.6s" repeatCount="indefinite"/></line>
    </g>

    <!-- fog band at horizon -->
    <rect x="0" y="430" width="1500" height="60" fill="#C084FC" opacity=".05" filter="url(#blur14)"/>

    <!-- ═══ TITLE LOCKUP ═══ -->
    <g font-weight="900" text-anchor="middle" font-size="84" letter-spacing="20">
      <text class="ga2" x="750" y="235" fill="#E040FB">POORAIY</text>
      <text class="gb2" x="750" y="235" fill="#00E5FF">POORAIY</text>
      <text x="750" y="233" fill="url(#titleCity)" filter="url(#ng2)">POORAIY</text>
    </g>
    <text class="mono" x="750" y="272" text-anchor="middle" font-size="15" fill="#C9B8EC" letter-spacing="6">// WELCOME TO THE CITY OF ENDLESS BUILD //</text>
    <g class="mono" font-size="13" text-anchor="middle" letter-spacing="1">
      <rect x="530" y="292" width="128" height="28" rx="14" fill="#0A0218" stroke="#00E5FF" stroke-opacity=".5"/>
      <text x="594" y="311" fill="#9BE8FF">DEVELOPER</text>
      <rect x="672" y="292" width="118" height="28" rx="14" fill="#0A0218" stroke="#B026FF" stroke-opacity=".5"/>
      <text x="731" y="311" fill="#D9B8FF">ENGINEER</text>
      <rect x="804" y="292" width="166" height="28" rx="14" fill="#0A0218" stroke="#E040FB" stroke-opacity=".5"/>
      <text x="887" y="311" fill="#FFC7F5">DIGITAL ARCHITECT</text>
    </g>

    <!-- ═══ RAIN ═══ -->
    <g clip-path="url(#cityClip)" stroke="#A78BFA" stroke-width="1.2" opacity=".16">
      <path d="M-100,-60 L 60,700" stroke-dasharray="12 148"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur=".62s" repeatCount="indefinite"/></path>
      <path d="M200,-60 L 360,700" stroke-dasharray="10 170"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".58s" begin=".1s" repeatCount="indefinite"/></path>
      <path d="M500,-60 L 660,700" stroke-dasharray="14 146"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur=".66s" begin=".05s" repeatCount="indefinite"/></path>
      <path d="M800,-60 L 960,700" stroke-dasharray="11 169"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".6s" begin=".2s" repeatCount="indefinite"/></path>
      <path d="M1100,-60 L 1260,700" stroke-dasharray="13 147"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur=".64s" begin=".15s" repeatCount="indefinite"/></path>
      <path d="M1380,-60 L 1540,700" stroke-dasharray="10 170"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".59s" begin=".25s" repeatCount="indefinite"/></path>
    </g>

    <!-- ═══ STREET + REFLECTIONS ═══ -->
    <rect x="0" y="580" width="1500" height="40" fill="#020108"/>
    <g filter="url(#blur6)">
      <ellipse class="reflP" cx="385" cy="590" rx="60" ry="7" fill="#00E5FF"/>
      <ellipse class="reflP" cx="960" cy="595" rx="46" ry="9" fill="#E040FB"/>
      <ellipse class="reflP" cx="1150" cy="588" rx="90" ry="6" fill="#B026FF"/>
      <ellipse cx="750" cy="598" rx="300" ry="8" fill="#43105F"/>
    </g>
    <line x1="0" y1="580" x2="1500" y2="580" stroke="#2D0A4E" stroke-width="1.5"/>
  </g>
</svg>
