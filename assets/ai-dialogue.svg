<svg width="900" height="540" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A0533"/><stop offset="100%" stop-color="#0D0219"/>
    </linearGradient>
    <filter id="aig"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Consolas,'Courier New',monospace; font-size:16px; }
    .q1{animation:ain .05s .5s both} .r1{animation:ain .05s 1.6s both}
    .q2{animation:ain .05s 3s both} .r2{animation:ain .05s 4.1s both}
    .q3{animation:ain .05s 5.5s both} .r3{animation:ain .05s 6.6s both} .fin{animation:ain .05s 7.8s both}
    @keyframes ain { from{opacity:0} to{opacity:1} }
    .curA { animation: ablink 1s steps(1) infinite; }
    @keyframes ablink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .aiDot { animation: aidot 1.4s ease-in-out infinite; }
    @keyframes aidot { 0%,100%{opacity:.4} 50%{opacity:1} }
  </style>

  <rect x="1" y="1" width="898" height="538" rx="14" fill="#070310" stroke="#B026FF" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="42" rx="14" fill="url(#aiBar)"/>
  <rect x="1" y="31" width="898" height="12" fill="#0D0219"/>
  <circle cx="28" cy="22" r="6" fill="#E040FB"/><circle cx="52" cy="22" r="6" fill="#B026FF"/><circle cx="76" cy="22" r="6" fill="#00E5FF"/>
  <text x="450" y="27" text-anchor="middle" font-size="14" fill="#8a7fa8">nexus://ai_uplink &#8212; pooraiy_intelligence v3</text>
  <circle class="aiDot" cx="862" cy="22" r="5" fill="#00E5FF"/>

  <!-- conversation -->
  <g>
    <text class="q1" x="30" y="82" fill="#00E5FF">GUEST&gt;</text>
    <text class="q1" x="120" y="82" fill="#cfc4e8">who is pooraiy?</text>

    <line x1="30" y1="102" x2="870" y2="102" stroke="#160533"/>

    <text class="r1" x="30" y="134" fill="#E040FB">NEXUS.AI&gt;</text>
    <text class="r1" x="140" y="134" fill="#eae6f2">developer &#183; engineer &#183; architect of digital futures.</text>
    <text class="r1" x="140" y="158" fill="#8a7fa8">operates from github.com/pooraiy. builds what others imagine.</text>

    <text class="q2" x="30" y="204" fill="#00E5FF">GUEST&gt;</text>
    <text class="q2" x="120" y="204" fill="#cfc4e8">what powers the system?</text>

    <line x1="30" y1="224" x2="870" y2="224" stroke="#160533"/>

    <text class="r2" x="30" y="256" fill="#E040FB">NEXUS.AI&gt;</text>
    <text class="r2" x="140" y="256" fill="#eae6f2">fuel mixture detected: curiosity + coffee + midnight builds.</text>
    <text class="r2" x="140" y="280" fill="#8a7fa8">processes: python, typescript, react, node, aws, docker...</text>

    <text class="q3" x="30" y="326" fill="#00E5FF">GUEST&gt;</text>
    <text class="q3" x="120" y="326" fill="#cfc4e8">can i collaborate with this operator?</text>

    <line x1="30" y1="346" x2="870" y2="346" stroke="#160533"/>

    <text class="r3" x="30" y="378" fill="#E040FB">NEXUS.AI&gt;</text>
    <text class="r3" x="140" y="378" fill="#eae6f2">uplink channels open below. ambitious minds prioritized.</text>
    <text class="r3" x="140" y="402" fill="#8a7fa8">response latency: &lt;24h earth-time.</text>

    <g class="fin">
      <rect x="140" y="430" width="600" height="52" rx="10" fill="#12042A" stroke="#2D0A4E"/>
      <text x="160" y="462" fill="#00E5FF" filter="url(#aig)">&#9679; SESSION VERDICT: follow &#183; star &#183; reach out</text>
      <text x="160" y="508" fill="#E9D5FF" font-size="18" letter-spacing="1">transmission encouraged<tspan class="curA" fill="#E040FB">&#9608;</tspan></text>
    </g>
  </g>
</svg>
